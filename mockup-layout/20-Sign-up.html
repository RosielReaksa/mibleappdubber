<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>T</title></head><body><style>body{margin:0;font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}
.eye,.bob,.spin,.float,.knob,.hand,.wave{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2s ease-in-out infinite}
.eye{animation:blink 4s infinite}
.spin{animation:spin 6s linear infinite}
.float{animation:float 3s ease-in infinite}.f2{animation-delay:1s}.f3{animation-delay:2s}
.knob{animation:slide 1.6s ease-in-out infinite}.k2{animation-duration:2.2s;animation-delay:-.6s}.k3{animation-duration:1.9s;animation-delay:-1s}
.hand{animation:tap 1.6s ease-in-out infinite}.h2{animation-duration:2.2s;animation-delay:-.6s}
.wave{animation:pulse 1.6s ease-in-out infinite}.w2{animation-delay:.4s}
.say{position:absolute;left:0;right:0;text-align:center;opacity:0;animation:say 12s infinite}
.fill{background:linear-gradient(90deg,#D97757,#E9A88F,#D97757);background-size:200px 100%;animation:shimmer 1.6s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%{transform:translateY(8px) scale(.6);opacity:0}50%{opacity:1}100%{transform:translateY(-14px) scale(1);opacity:0}}
@keyframes slide{0%,100%{transform:translateY(0)}50%{transform:translateY(16px)}}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes say{0%{opacity:0;transform:translateY(6px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes shimmer{to{background-position:200px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.say:first-child{opacity:1}}
.mix{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
.mix::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(#D97757,#D97757) 0/var(--v) 100% no-repeat,#E8E5DA}
.mix::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:20px;border-radius:4px;background:#141413;margin-top:-7px}
.mix::-moz-range-track{height:6px;border-radius:99px;background:#E8E5DA}
.mix::-moz-range-progress{height:6px;border-radius:99px;background:#D97757}
.mix::-moz-range-thumb{width:8px;height:20px;border:0;border-radius:4px;background:#141413}
</style><div style="width:390px;height:844px;box-sizing:border-box;background:#FAF9F5;color:#141413;display:flex;flex-direction:column;overflow:hidden"><div style="height:48px;flex:none"></div><div style="flex:1;min-height:0;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px"><div style="display:flex;align-items:center;gap:10px"><svg width="32" height="32" sc-camel-view-box="0 0 32 32" fill="none" stroke="#D97757" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 14v4M10 10v12M15 5v22M20 9v14M25 13v6"></path></svg><span style="font-family:Newsreader,Georgia,serif;font-weight:500;letter-spacing:-0.01em;font-size:30px">Dubber</span></div><h2 style="margin:0;font-family:Newsreader,Georgia,serif;font-weight:500;letter-spacing:-0.01em;font-size:30px;line-height:1.15">Create your account</h2><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500">Name<input type="text" placeholder="Your name" style="height:52px;border:1px solid #D9D6CB;border-radius:14px;padding:0 14px;font-size:16px;background:#fff;color:#141413"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500">Email<input type="email" placeholder="you@email.com" style="height:52px;border:1px solid #D9D6CB;border-radius:14px;padding:0 14px;font-size:16px;background:#fff;color:#141413"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500">Password<input type="password" placeholder="Password" style="height:52px;border:1px solid #D9D6CB;border-radius:14px;padding:0 14px;font-size:16px;background:#fff;color:#141413"><span style="font-size:12px;font-weight:400;color:#66655E">At least 8 characters</span></label><label style="display:flex;gap:10px;align-items:center;font-size:14px;color:#4A4943"><input type="checkbox" style="width:22px;height:22px;accent-color:#B5502D">I agree to the terms and privacy policy</label></div><div style="flex:none;padding:12px 20px;display:flex;flex-direction:column;gap:10px"><button style="display:block;width:100%;box-sizing:border-box;height:52px;border-radius:14px;font-size:16px;font-weight:600;border:0;background:#B5502D;color:#fff">Create account</button><p style="margin:4px 0 0;text-align:center;font-size:15px;color:#66655E">Already have an account? <a href="#" style="color:#B5502D;font-weight:600">Log in</a></p></div></div>
</body></html>
